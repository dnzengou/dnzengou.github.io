<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricette — Caffetteria Mazzetti</title>
<meta name="theme-color" content="#2c3a4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--kraft:#c4a574;--paper:#f6ead0;--ink:#2a2418;--soft:#5c4e3a;--navy:#2c3a4a;--wine:#7a3224;--rule:#d2bf96}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#b89563;color:var(--ink);font-family:"Libre Baskerville",Georgia,serif}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{display:none;height:100%;grid-template-rows:auto 1fr;background:radial-gradient(ellipse at top,#e8d4a8,transparent 55%),#c9a66e}
.app.on{display:grid}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:rgba(246,234,208,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);font-family:Outfit,sans-serif;z-index:5}
.brand{font-weight:600;letter-spacing:.16em;font-size:11px;text-transform:uppercase;color:var(--navy)}
.search{flex:1;min-width:160px;position:relative}
.search input{width:100%;border:1px solid var(--rule);background:#fff8e8;border-radius:999px;padding:8px 14px 8px 34px;outline:none}
.search::before{content:"⌕";position:absolute;left:12px;top:7px;color:var(--soft)}
.langs,.tools{display:flex;gap:6px}
.chip{border:1px solid var(--navy);background:transparent;color:var(--navy);font-family:Outfit,sans-serif;font-size:12px;letter-spacing:.06em;padding:6px 10px;border-radius:999px}
.chip[aria-pressed="true"],.chip.on{background:var(--navy);color:var(--paper)}
.chip.warn{position:relative}
.chip .n{position:absolute;top:-6px;right:-6px;background:var(--wine);color:#fff;border-radius:99px;font-size:10px;min-width:16px;padding:1px 4px}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:0}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.side{border-right:1px solid var(--rule);background:rgba(246,234,208,.7);padding:16px 12px;overflow:auto;font-family:Outfit,sans-serif}
@media(max-width:820px){.side{display:flex;gap:8px;overflow:auto;border-right:0;border-bottom:1px solid var(--rule)}}
.side h3{margin:16px 8px 6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--wine)}
@media(max-width:820px){.side h3{display:none}}
.navb{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;color:var(--ink)}
.navb:hover,.navb.on{background:#efe0bc}
.main{overflow:auto;padding:22px 18px 80px}
.hero{border-radius:14px;overflow:hidden;min-height:180px;background:#333 center/cover no-repeat;display:flex;align-items:flex-end;margin-bottom:18px;box-shadow:0 12px 30px rgba(60,40,10,.18)}
.hero span{display:block;width:100%;padding:18px 20px;background:linear-gradient(transparent,rgba(24,18,10,.72));color:#f6ead0;font-family:Outfit,sans-serif;font-size:28px;letter-spacing:.14em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--paper);border-radius:12px;padding:16px;cursor:pointer;box-shadow:0 8px 22px rgba(60,40,10,.12);transition:transform .15s ease}
.card:hover{transform:translateY(-2px)}
.card .mo{font-family:Outfit,sans-serif;font-size:11px;letter-spacing:.16em;color:var(--wine);text-transform:uppercase}
.card h4{margin:6px 0 4px;font-family:Outfit,sans-serif;font-size:18px}
.card p{margin:0;color:var(--soft);font-size:13px;font-style:italic;min-height:2.4em}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:Outfit,sans-serif;font-size:12px;color:var(--soft)}
.heart{border:0;background:transparent;font-size:18px}.heart.on{color:var(--wine)}
.count{font-family:Outfit,sans-serif;font-size:12px;color:var(--soft);margin:0 0 14px}
.cover{min-height:100%;display:flex;align-items:center;justify-content:center;background:#c4a06a url("cover-photo.jpg") center/cover no-repeat}
.cover-card{width:min(420px,92vw);background:rgba(246,234,208,.92);text-align:center;padding:36px 28px 28px;border-radius:4px;box-shadow:0 20px 50px rgba(40,20,0,.28)}
.cover-card h1{font-family:Outfit,sans-serif;font-weight:300;letter-spacing:.22em;font-size:48px;margin:12px 0 6px;color:var(--navy)}
.cover-card .sub{font-family:Outfit,sans-serif;letter-spacing:.26em;font-size:12px;text-transform:uppercase}
.cover-card button{margin-top:22px}
.overlay{position:fixed;inset:0;background:rgba(30,20,10,.45);display:none;z-index:30;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.panel{background:var(--paper);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:22px 22px 40px}
.panel header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.panel h2{font-family:Outfit,sans-serif;margin:0 0 4px;font-size:26px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.label{font-family:Outfit,sans-serif;font-size:11px;letter-spacing:.16em;color:var(--wine);font-weight:600;margin:16px 0 6px;text-transform:uppercase}
.it{line-height:1.65}.tr{color:var(--soft);font-style:italic;line-height:1.6;margin-top:4px}
textarea{width:100%;min-height:90px;border:1px dashed var(--rule);background:#fff8e8;padding:10px;border-radius:8px}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,100%);background:var(--paper);transform:translateX(110%);transition:transform .25s;z-index:40;padding:20px;overflow:auto;box-shadow:-12px 0 30px rgba(0,0,0,.18)}
.drawer.on{transform:none}
.shop-item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.cook{position:fixed;inset:0;background:#1c1710;color:#f6ead0;display:none;z-index:50;padding:24px;flex-direction:column}
.cook.on{display:flex}
.cook .step{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(20px,4vw,34px);line-height:1.45;padding:20px}
.cook nav{display:flex;justify-content:space-between;align-items:center;font-family:Outfit,sans-serif}
.timer{font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--paper);padding:8px 14px;border-radius:999px;font-family:Outfit,sans-serif;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.on{opacity:1}
.dedica p{text-align:center;margin:.3em 0;font-style:italic}
.empty{color:var(--soft);font-style:italic}
@media print{.top,.side,.acts,.search,.langs,.tools,textarea,.cover{display:none!important}.app{display:block!important;background:#fff}.panel,.overlay{position:static;display:block!important;box-shadow:none;max-height:none}}
</style>
</head>
<body>
<section class="cover" id="cover">
  <div class="cover-card">
    <svg width="140" height="90" viewBox="0 0 280 180" aria-hidden="true">
      <path d="M54 78c0-22 18-40 64-40s64 18 64 40v40c0 22-18 36-64 36s-64-14-64-36V78z" fill="#efe3c8" stroke="#2c3a4a" stroke-width="2.4"/>
      <ellipse cx="118" cy="78" rx="56" ry="14" fill="#3a2a1c"/>
      <path d="M182 88c22 2 38 16 36 36" stroke="#2c3a4a" stroke-width="2.4" fill="none"/>
      <path d="M108 74c18-38 48-62 92-70" stroke="#2c3a4a" stroke-width="2.6" fill="#d8c4a0"/>
    </svg>
    <h1>RICETTE</h1>
    <div class="sub">Caffetteria : Mazzetti</div>
    <button class="chip on" id="openBtn">Apri il ricettario</button>
  </div>
</section>
<div class="app" id="app">
  <div class="top">
    <span class="brand">Caffetteria · Mazzetti</span>
    <div class="search"><input id="q" placeholder="Cerca una ricetta…"></div>
    <div class="langs">
      <button class="chip" data-lang="it">IT</button>
      <button class="chip" data-lang="en">EN</button>
      <button class="chip" data-lang="sv">SV</button>
    </div>
    <div class="tools">
      <button class="chip" id="btnFav">Preferiti</button>
      <button class="chip warn" id="btnShop">Spesa <span class="n" id="shopN" hidden>0</span></button>
      <button class="chip" id="btnAbout">Il caffè</button>
    </div>
  </div>
  <div class="layout">
    <aside class="side" id="side"></aside>
    <main class="main">
      <div class="hero" id="hero"><span id="heroTitle"></span></div>
      <p class="count" id="count"></p>
      <div class="grid" id="grid"></div>
    </main>
  </div>
</div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
<aside class="drawer" id="drawer"></aside>
<div class="cook" id="cook"></div>
<div class="toast" id="toast"></div>
<script src="images.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
