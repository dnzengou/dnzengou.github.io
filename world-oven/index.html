<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The World Oven — simple healthy baking</title>
<meta name="theme-color" content="#3d2a1e">
<meta name="description" content="A small world cookbook of simple, authentic, healthy breads and cakes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --flour:#f3ead9;--milk:#fffaf2;--crust:#8b3e22;--seed:#2c2118;
  --sage:#5a6a48;--honey:#c9842a;--ash:#6d5c4c;--rule:#e0d2b8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2c2118;color:var(--seed);font-family:Fraunces,Georgia,serif}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{display:none;height:100%;grid-template-rows:auto 1fr;background:
  radial-gradient(ellipse at top left,rgba(201,132,42,.18),transparent 50%),
  linear-gradient(#f6efe0,#e8d9b8)}
.app.on{display:grid}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:rgba(255,250,242,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);font-family:"Nunito Sans",sans-serif;z-index:5}
.brand{font-weight:700;letter-spacing:.18em;font-size:11px;text-transform:uppercase;color:var(--crust)}
.search{flex:1;min-width:160px;position:relative}
.search input{width:100%;border:1px solid var(--rule);background:#fff;border-radius:999px;padding:8px 14px 8px 34px;outline:none}
.search::before{content:"⌕";position:absolute;left:12px;top:7px;color:var(--ash)}
.langs,.tools{display:flex;gap:6px}
.chip{border:1px solid var(--seed);background:transparent;color:var(--seed);font-family:"Nunito Sans",sans-serif;font-size:12px;letter-spacing:.06em;padding:6px 10px;border-radius:999px}
.chip[aria-pressed="true"],.chip.on{background:var(--seed);color:var(--flour)}
.chip.warn{position:relative}
.chip .n{position:absolute;top:-6px;right:-6px;background:var(--crust);color:#fff;border-radius:99px;font-size:10px;min-width:16px;padding:1px 4px}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:0}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.side{border-right:1px solid var(--rule);background:rgba(255,250,242,.55);padding:16px 12px;overflow:auto;font-family:"Nunito Sans",sans-serif}
@media(max-width:820px){.side{display:flex;gap:8px;overflow:auto;border-right:0;border-bottom:1px solid var(--rule)}}
.side h3{margin:16px 8px 6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--crust)}
@media(max-width:820px){.side h3{display:none}}
.navb{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;color:var(--seed)}
.navb:hover,.navb.on{background:#efe3c8}
.main{overflow:auto;padding:22px 18px 80px}
.hero{border-radius:16px;overflow:hidden;min-height:170px;display:flex;align-items:flex-end;margin-bottom:18px;box-shadow:0 12px 30px rgba(44,33,24,.16)}
.hero span{display:block;width:100%;padding:18px 20px;background:linear-gradient(transparent,rgba(24,16,10,.62));color:#f3ead9;font-family:"Nunito Sans",sans-serif;font-size:26px;letter-spacing:.12em;text-transform:uppercase}
.hero.r-WORLD{background:linear-gradient(120deg,#6b3a24,#c9842a 55%,#5a6a48)}
.hero.r-EUROPE{background:linear-gradient(120deg,#3d4a38,#8a9a6a)}
.hero.r-MED{background:linear-gradient(120deg,#1e4a4a,#d4a04a)}
.hero.r-LEVANT{background:linear-gradient(120deg,#5a2a1a,#c45a2a)}
.hero.r-ASIA{background:linear-gradient(120deg,#2a3a28,#7a9a48)}
.hero.r-AMERICAS{background:linear-gradient(120deg,#6a2a1a,#e07a2a)}
.hero.r-AFRICA{background:linear-gradient(120deg,#3a2414,#c9842a)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--milk);border-radius:14px;padding:16px;cursor:pointer;box-shadow:0 8px 22px rgba(44,33,24,.1);transition:transform .15s ease;border:1px solid rgba(141,62,34,.08)}
.card:hover{transform:translateY(-2px)}
.card .mo{font-family:"Nunito Sans",sans-serif;font-size:11px;letter-spacing:.14em;color:var(--crust);text-transform:uppercase}
.card h4{margin:6px 0 4px;font-size:20px;font-weight:600}
.card p{margin:0;color:var(--ash);font-size:13px;font-style:italic;min-height:2.6em}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:"Nunito Sans",sans-serif;font-size:12px;color:var(--ash)}
.heart{border:0;background:transparent;font-size:18px}.heart.on{color:var(--crust)}
.count{font-family:"Nunito Sans",sans-serif;font-size:12px;color:var(--ash);margin:0 0 14px}
.cover{min-height:100%;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 20%,rgba(201,132,42,.35),transparent 40%),
  radial-gradient(circle at 80% 80%,rgba(90,106,72,.3),transparent 42%),
  #2c2118}
.cover-card{width:min(440px,92vw);background:rgba(243,234,217,.95);text-align:center;padding:40px 28px 30px;border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.cover-card h1{font-weight:400;letter-spacing:.08em;font-size:42px;margin:10px 0 8px;color:var(--seed);line-height:1.05}
.cover-card .sub{font-family:"Nunito Sans",sans-serif;letter-spacing:.2em;font-size:11px;text-transform:uppercase;color:var(--crust)}
.cover-card .lede{margin:14px 28px 0;color:var(--ash);font-size:15px;font-style:italic}
.cover-card button{margin-top:22px}
.overlay{position:fixed;inset:0;background:rgba(20,14,10,.5);display:none;z-index:30;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.panel{background:var(--milk);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:22px 22px 40px}
.panel header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.panel h2{margin:0 0 4px;font-size:28px;font-weight:600}
.mo{font-family:"Nunito Sans",sans-serif;letter-spacing:.14em;color:var(--crust);font-size:11px;text-transform:uppercase}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.label{font-family:"Nunito Sans",sans-serif;font-size:11px;letter-spacing:.16em;color:var(--crust);font-weight:700;margin:16px 0 6px;text-transform:uppercase}
.it{line-height:1.65}.tr{color:var(--ash);font-style:italic;line-height:1.6;margin-top:4px}
textarea{width:100%;min-height:90px;border:1px dashed var(--rule);background:#fff;padding:10px;border-radius:8px}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,100%);background:var(--milk);transform:translateX(110%);transition:transform .25s;z-index:40;padding:20px;overflow:auto;box-shadow:-12px 0 30px rgba(0,0,0,.18)}
.drawer.on{transform:none}
.shop-item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.cook{position:fixed;inset:0;background:#1a140f;color:#f3ead9;display:none;z-index:50;padding:24px;flex-direction:column}
.cook.on{display:flex}
.cook .step{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(20px,4vw,34px);line-height:1.45;padding:20px}
.cook nav{display:flex;justify-content:space-between;align-items:center;font-family:"Nunito Sans",sans-serif}
.timer{font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--seed);color:var(--flour);padding:8px 14px;border-radius:999px;font-family:"Nunito Sans",sans-serif;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.on{opacity:1}
.dedica p{text-align:center;margin:.35em 0;font-style:italic}
.empty{color:var(--ash);font-style:italic}
@media print{.top,.side,.acts,.search,.langs,.tools,textarea,.cover{display:none!important}.app{display:block!important;background:#fff}.panel,.overlay{position:static;display:block!important;box-shadow:none;max-height:none}}
</style>
</head>
<body>
<section class="cover" id="cover">
  <div class="cover-card">
    <svg width="120" height="72" viewBox="0 0 120 72" aria-hidden="true">
      <ellipse cx="60" cy="52" rx="38" ry="10" fill="#e8d3a8"/>
      <path d="M28 50c2-18 14-36 32-36s30 18 32 36" fill="#f4e7cc" stroke="#2c2118" stroke-width="1.6"/>
      <path d="M36 48c4-14 12-26 24-26s20 12 24 26" fill="none" stroke="#8b3e22" stroke-width="1.2"/>
      <circle cx="60" cy="28" r="3" fill="#5a6a48"/>
    </svg>
    <div class="sub">A home baker’s atlas</div>
    <h1>The World Oven</h1>
    <p class="lede">Simple, authentic, healthy breads and cakes from many kitchens.</p>
    <button class="chip on" id="openBtn">Open the oven</button>
  </div>
</section>
<div class="app" id="app">
  <div class="top">
    <span class="brand">The World Oven</span>
    <div class="search"><input id="q" placeholder="Search a bake…"></div>
    <div class="langs">
      <button class="chip" data-lang="en">EN</button>
      <button class="chip" data-lang="it">IT</button>
      <button class="chip" data-lang="sv">SV</button>
    </div>
    <div class="tools">
      <button class="chip" id="btnFav">Favourites</button>
      <button class="chip warn" id="btnShop">Shop <span class="n" id="shopN" hidden>0</span></button>
      <button class="chip" id="btnAbout">The book</button>
    </div>
  </div>
  <div class="layout">
    <aside class="side" id="side"></aside>
    <main class="main">
      <div class="hero r-WORLD" id="hero"><span id="heroTitle"></span></div>
      <p class="count" id="count"></p>
      <div class="grid" id="grid"></div>
    </main>
  </div>
</div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
<aside class="drawer" id="drawer"></aside>
<div class="cook" id="cook"></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
